la_mcts:
  obs_dim: 27
  max_action_dim: 8
  k_tok: 8
  d_model: 256
  n_heads: 4
  l_enc: 2
  latent_dim: 256
  num_peaks: 4
  log_std_bounds: [-1.8, 0.25]
  use_categorical_critic: true
  support_min: -150
  support_max: 150
  num_bins: 301
  gamma: 0.99
  td_steps: 5
  target_tau: 0.01
  l_dyn: 3
  proj_dim: 512
  pred_dim: 256
  unroll_steps: 5
  lambda_rep: 2.0
  beta_mse: 1.0
  lambda_v: 0.5
  lambda_r: 1.0
  lambda_p: 1.0
  lambda_ent: 0.03
  c_reg: 0.0001
  n_sim: 32
  n_sim_eval: 64
  k_act: 8
  c_1: 2.00
  c_2: 19652.0
  root_tau_beta: 1.0
  inner_tau_beta: 0.8
  root_dirichlet_alpha: 0.35
  root_exploration_fraction: 0.40
  root_exploration_fraction_end: 0.12
  tau_act_train: 1.0
  tau_act_train_end: 0.15
  tau_act_eval: 0.05
  adaptive_exploration: true
  min_policy_std_target: 0.22
  min_policy_std_target_end: 0.12
  exploration_boost_max: 2.75
  latent_noise_std: 0.08
  latent_noise_std_end: 0.0
  mode_hold_steps: 8
  mode_commitment_prob: 0.70
  lambda_peak_ent: 0.15
  lambda_peak_ent_end: 0.02
  peak_entropy_floor_ratio: 0.70
  lambda_peak_sep: 0.25
  lambda_peak_sep_end: 0.05
  min_peak_separation: 0.40
  critic_warmup_steps: 5000
  lr: 0.00018
  batch_size: 128
  buffer_capacity: 50000
  context_dim: 18
  history_len: 6
  latent_ema_decay: 0.2
  reanalyze_ratio: 0.25
  train_every_steps: 50     # agent update every N env steps (0 = auto: max_steps // 2)
  reanalyze_every: 4        # Reanalyze every N episodes (0 = off)
  reanalyze_states: 4       # states refreshed per Reanalyze pass

brl:
  num_params: 18
  param_max: 1000.0
  budget_max: 8500.0
  cost_min: 0.1
  cost_max: 10.0
  target_win_rate: 0.50
  ema_beta_w: 0.05
  tau_s: 500.0
  initial_r_ref: 0.0
  benchmark_r_ref: 6169.54
  min_win_velocity: 0.05    # minimum mean x_velocity (m/s) required to count as a WIN (0.0 disables)
  r_ref_target_mult: 1.02   # multiplier on episode_return when raising r_ref (>1.0 keeps duel challenging)
  window_k_w: 20
  alpha_eq: 10.0
  alpha_inst: 2.0
  alpha_prog: 5.0
  sigma_zpd: 0.15
  lambda_entropy: 0.5
  balancer_lr: 0.0001
  balancer_tau: 0.005
  balancer_noise_std: 0.05
  balancer_noise_std_end: 0.01
  tweaker_lr: 0.0003
  beta_score: 1.0
  eta_viol: 2.0
  beta_ent: 0.01
  beta_ent_end: 0.002
  warmup_episodes: 150
  brl_episodes: 10000
  total_episodes: 10000
  warmup_limit: 30.0
  warmup_budget: 90.0

ant_morph:
  env_id: "Ant-v5"
  use_contact_forces: false
  max_episode_steps: 1000
  xml_rebuild_threshold: 1.0
  healthy_z_range: [0.2, 1.0]
  max_action_capacity: 12
  default_num_legs: 4
  action_ema_alpha: 0.35 # smooth early 50ms jitter -> scales to 1.0 at 1000 return
  action_smoothness_coef: 0.05 # smoothness 0.06
  action_smoothness_end_step: 500000
  forward_reward_weight: 4.0 # training-only agent_reward forward scale (Eval/raw Ant-v5 stays standard 1.0)
  ctrl_cost_weight: 0.30     # training-only agent_reward torque cost weight (blends to standard Ant-v5 0.5)
  benchmark_vel_ref: 0.20
  torque_return_ref: 1000.0
  exploration_return_ref: 3000.0
  forward_return_ref: 5000.0 # rolling-20 raw return at which forward_reward_weight -> 1.0 and ctrl_cost_weight -> 0.5
  vel_std_threshold: 0.20
  vel_shift_factor: 3000.0
  upside_down_time_limit: 0.0
  upside_down_penalty: 0.0
  min_healthy_vel: 0.05     # training-only: scale healthy_reward by clip(v_x / min_healthy_vel, 0, 1); 0.0 disables
  stationary_penalty_coef: 0.35  # training-only: extra per-step penalty coef * (1 - vel_gate) fed into MCTS rewards; 0.0 disables
  stationary_vel_window: 20      # steps (~1.0s) of rolling-mean x-velocity used for the velocity gate

# Run protocol defaults for experiments/train_ant_brl.py (CLI flags override; 0 = automatic)
run:
  seeds: 10
  seed_offset: 42
  episodes: 0          # 0 = brl.total_episodes
  max_steps: 0         # 0 = ant_morph.max_episode_steps
  device: "cuda"
  eval_interval: 25     # 0 = min(10, episodes)
  checkpoint_interval: 500 # Periodic milestone checkpoint interval in episodes
  parallel_seeds: 3
  gpu_mem_fraction: 0.0
